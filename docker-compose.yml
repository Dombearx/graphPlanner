services:
  graphplanner:
    build:
      context: .
      args:
        # Puste domyślnie: serwer sam nie zna żadnej podścieżki (patrz
        # `express.static` w server/index.js), więc obraz zbudowany bez tej
        # zmiennej musi odpowiadać poprawnie pod korzeniem — na tym opiera się
        # `deploy-stack.yml`, które łączy się z kontenerem wprost, bez proxy.
        # Na hoście, który faktycznie stoi za nginksem obcinającym prefiks
        # (np. "/planner/" za doodle-v1), ustaw VITE_BASE_PATH w środowisku
        # przed `docker compose build` (drop-in systemd usługi aktualizacji
        # albo plik .env obok tego pliku) — nie tutaj, bo to złamałoby smoke
        # test, który sprawdza obraz bez reverse proxy.
        VITE_BASE_PATH: ${VITE_BASE_PATH:-}
    container_name: graphplanner
    # Obraz dostaje tag commita, z którego powstał (serwer aktualizacji podaje
    # IMAGE_TAG przy wdrożeniu), więc `docker images` odpowiada na pytanie "co
    # właściwie chodzi", a cofnięcie się to `IMAGE_TAG=<starszy sha> docker
    # compose up -d` na obrazie, który wciąż leży na dysku.
    image: graphplanner:${IMAGE_TAG:-local}
    ports:
      # Zmień na "80:3001", jeśli aplikacja ma działać pod adresem bez portu.
      - "3001:3001"
    volumes:
      # Baza SQLite zostaje na hoście - przetrwa przebudowę obrazu.
      - ./data:/data
    environment:
      DATA_DIR: /data
      # SEED: "0"   # odkomentuj, żeby nie tworzyć przykładowego planu na starcie
    restart: unless-stopped
