services:
  graphplanner:
    build:
      context: .
      args:
        # appka wisi za reverse proxy nginx (doodle-v1) pod /planner/ —
        # zmień/wyczyść jeśli kiedyś przestanie tak być wystawiona
        VITE_BASE_PATH: /planner/
    container_name: graphplanner
    # Obraz dostaje tag commita, z którego powstał (serwer aktualizacji podaje
    # IMAGE_TAG przy wdrożeniu), więc `docker images` odpowiada na pytanie "co
    # właściwie chodzi", a cofnięcie się to `IMAGE_TAG=<starszy sha> docker
    # compose up -d` na obrazie, który wciąż leży na dysku.
    image: graphplanner:${IMAGE_TAG:-local}
    ports:
      # Zmień na "80:3001", jeśli aplikacja ma działać pod adresem bez portu.
      - "3001:3001"
    volumes:
      # Baza SQLite zostaje na hoście - przetrwa przebudowę obrazu.
      - ./data:/data
    environment:
      DATA_DIR: /data
      # SEED: "0"   # odkomentuj, żeby nie tworzyć przykładowego planu na starcie
    restart: unless-stopped
